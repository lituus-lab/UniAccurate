name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the previous run's answer irrelevant: cancel it rather
# than pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The CI every Uni* engine runs, held once in lituus-lab/.github rather
    # than copied per repo. Pinned by commit: a moving ref here would be the
    # same unpinned dependency the family forbids everywhere else.
    uses: lituus-lab/.github/.github/workflows/uni-nim-library.yml@6c44c93c77d604d950b74309d75592a7a68f5c42
    permissions:
      # A called workflow cannot obtain more than the calling job grants.
      contents: read
      pages: write
      id-token: write
    with:
      library: UniAccurate
      module: uniaccurate
      python-smoke-test: py/tests/*.py

  simd:
    name: SIMD (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Read-only token: the job only checks out and runs tests, never pushes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = amd64 AVX2; macos = arm64 NEON. AVX-512 is not guaranteed on
        # GitHub runners, so the Zen4 path stays a manual FreeBSD check.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - name: AVX2 Nim tests (amd64)
        if: runner.os == 'Linux'
        run: $GATE simdAvx2
      - name: NEON Nim tests (arm64)
        if: runner.os == 'macOS'
        run: $GATE simd
      - run: $GATE testSimd
      - run: $GATE ctestSimd

  bench:
    name: Bench smoke (${{ matrix.os }})
    # Correctness/non-regression smoke on reduced sizes, not the AVX-512
    # reference numbers from ADR-0007 -- GitHub runners are not guaranteed
    # AVX-512 hardware, that comparison stays a manual FreeBSD/Zen4 check.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE bench
      - name: Upload Bench CSVs
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: bench/compare/*.csv

  all-green:
    name: All green
    # The one check branch protection requires, and the only name that has to
    # stay stable. `needs.ci.result` is the whole called workflow's verdict; a
    # repo with jobs of its own adds them here beside it.
    needs: [ci, simd, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for one in $results; do
            case "$one" in
              success) ;;
              skipped) ;;
              *) echo "all-green: a required job reported $one" >&2; exit 1 ;;
            esac
          done
