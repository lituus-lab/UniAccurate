# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.
#
# Layering (lowest first): error-free transformations are the foundation; the
# summation and dot-product algorithms build on them; the SIMD backend may
# reuse the scalar algorithms but the scalar path never depends on SIMD (so
# `-d:simd` stays optional); the C ABI sits on top and nothing imports it.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (twosum -> twosum.nim)
# or a directory (algorithms -> algorithms/*.nim). Modules under no listed
# layer are unconstrained: the umbrella module re-exports everything.
[layers]
twosum
algorithms
simd
c_api

# Similarly-prefixed packages this repo may name in `requires` (ADR-0001).
# Empty today: UniAccurate depends on none. Non-Uni deps (nim, NimContracts,
# nimsimd) are external infra and go unchecked.
[engines]
